<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Informe de pesaje · Pesos Pollitas Pro</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
background:#f4f7f3;
color:#1f2933
}

.wrap{
max-width:900px;
margin:auto;
padding:18px 14px 40px
}

.toolbar{
display:flex;
gap:8px;
margin-bottom:14px
}

button{
border:0;
border-radius:11px;
padding:12px 15px;
font-weight:800;
font-size:15px;
background:#245c3a;
color:#fff
}

button.secondary{
background:#e5ece6;
color:#245c3a
}

select{
width:100%;
padding:12px;
border:1px solid #d5ddd6;
border-radius:11px;
font-size:16px;
background:#fff;
margin-bottom:14px
}

.report{
background:#fff;
border:1px solid #dfe7df;
border-radius:16px;
padding:24px;
box-shadow:0 2px 8px #00000008
}

.head{
display:flex;
align-items:center;
gap:16px;
border-bottom:2px solid #245c3a;
padding-bottom:14px;
margin-bottom:14px
}

.head img{
height:55px;
border-radius:8px
}

.head h1{
margin:0;
font-size:25px
}

.head p{
margin:3px 0 0;
color:#667085
}

.info{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:7px;
margin:10px 0 14px
}

.info div{
padding:8px;
border-bottom:1px solid #e5e7eb
}

.info b{
display:block;
font-size:11px;
color:#667085;
margin-bottom:2px
}

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
margin:10px 0
}

.metric{
background:#f7faf7;
border-radius:10px;
padding:11px
}

.metric b{
font-size:19px;
display:block
}

.metric span{
font-size:11px;
color:#6b7280
}

h2{
font-size:16px;
margin:14px 0 7px
}

.status{
padding:10px;
border-radius:10px;
background:#e7f2e9;
font-weight:700;
font-size:13px
}

p{
margin:6px 0;
font-size:12px
}

.note{
color:#667085;
font-size:9px
}

.error{
padding:18px;
text-align:center;
color:#a33232
}

@media(max-width:650px){
.info,.grid{
grid-template-columns:1fr
}
}

@media print{

@page{
size:A4 portrait;
margin:6mm
}

body{
background:#fff;
font-size:9px
}

.wrap{
padding:0;
max-width:none
}

.toolbar,.selector{
display:none
}

.report{
border:0;
box-shadow:none;
padding:0;
border-radius:0
}

.head{
gap:8px;
padding-bottom:5px;
margin-bottom:5px
}

.head img{
height:34px
}

.head h1{
font-size:18px
}

.head p{
font-size:9px
}

.info{
grid-template-columns:repeat(3,1fr);
gap:3px;
margin:4px 0 5px
}

.info div{
padding:3px
}

.info b{
font-size:7px;
margin-bottom:1px
}

.grid{
grid-template-columns:repeat(3,1fr);
gap:4px;
margin:4px 0
}

.metric{
padding:5px
}

.metric b{
font-size:12px
}

.metric span{
font-size:7px
}

h2{
font-size:11px;
margin:5px 0 3px
}

.status{
padding:5px;
font-size:8px;
margin-bottom:4px
}

.charts{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
margin:3px 0 4px
}

.chartBox{
border:1px solid #dfe7df;
border-radius:8px;
padding:5px;
break-inside:avoid
}

.chartBox>b{
font-size:8px;
display:block;
margin-bottom:2px
}

canvas{
display:block;
width:100%;
height:95px
}

p{
font-size:8px;
margin:3px 0
}

.note{
font-size:6.5px
}

button{
display:none
}

}
</style>
</head>

<body>

<div class="wrap">

<div class="toolbar">
<button onclick="window.print()">📄 Generar / guardar PDF</button>
<button class="secondary" onclick="location.href='index.html'">← Volver a la app</button>
</div>

<div class="selector">
<label><b>Elegí el pesaje a informar</b></label>
<select id="sel" onchange="render();dibujarGraficos()"></select>
</div>

<div id="report" class="report"></div>

</div>

<script>

const KEY='pesos_pollitas_pro_v2';

let db=JSON.parse(
localStorage.getItem(KEY)||'{"lotes":[],"pesajes":[]}'
);

const $=id=>document.getElementById(id);

function esc(s){
return String(s??'').replace(
/[&<>"']/g,
c=>({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#39;'
}[c])
);
}

function fechaLocal(s){
if(!s)return null;
let [y,m,d]=s.split('-').map(Number);
return new Date(y,m-1,d);
}

function edad(lote,fecha){

let b=fechaLocal(lote?.nacimiento);
let f=fechaLocal(fecha);

if(!b||!f)return '-';

let d=Math.floor((f-b)/86400000);

if(d<0)return '-';

return `${Math.floor(d/7)} semanas + ${d%7} días`;
}

function render(){

let id=$('sel').value;
let p=db.pesajes.find(x=>x.id===id);

if(!p){
$('report').innerHTML=
'<div class="error">No hay pesajes guardados para informar.</div>';
return;
}

let l=db.lotes.find(x=>x.id===p.loteId)||{};

let d=p.objetivo
?p.stats.m-p.objetivo
:null;

let estado=
d===null
?'Sin objetivo'
:d>=0
?`Por encima de la referencia (+${d.toFixed(0)} g)`
:`Por debajo de la referencia (${d.toFixed(0)} g)`;

$('report').innerHTML=`

<div class="head">

<img src="Gottig-Emprendimiento-Logo.png">

<div>
<h1>Informe de pesaje</h1>
<p>Pesos Pollitas Pro · Gottig Emprendimiento</p>
</div>

</div>

<div class="info">

<div>
<b>Lote</b>
${esc(l.nombre||'-')}
</div>

<div>
<b>Genética</b>
${esc(l.genetica||'-')}
</div>

<div>
<b>Galpón</b>
${esc(l.galpon||'-')}
</div>

<div>
<b>Fecha</b>
${esc(p.fecha||'-')}
</div>

<div>
<b>Edad</b>
${edad(l,p.fecha)}
</div>

<div>
<b>Aves pesadas</b>
${p.pesos.length}
</div>

</div>

<h2>Resultados</h2>

<div class="grid">

<div class="metric">
<b>${p.stats.m.toFixed(0)} g</b>
<span>Peso promedio</span>
</div>

<div class="metric">
<b>${p.stats.u.toFixed(1)}%</b>
<span>Uniformidad ±10%</span>
</div>

<div class="metric">
<b>${p.stats.cv.toFixed(1)}%</b>
<span>Coeficiente de variación</span>
</div>

<div class="metric">
<b>${p.stats.min} g</b>
<span>Peso mínimo</span>
</div>

<div class="metric">
<b>${p.stats.max} g</b>
<span>Peso máximo</span>
</div>

<div class="metric">
<b>${p.objetivo?p.objetivo+' g':'-'}</b>
<span>Referencia cargada</span>
</div>

</div>

<div class="status">
${estado}
</div>
<h2>Gráficos</h2>

<div class="charts">

<div class="chartBox">
<b>Evolución del peso promedio</b>
<canvas id="graficoEvolucion" height="220"></canvas>
</div>

<div class="chartBox">
<b>Peso vs. referencia Hy-Line W-80</b>
<canvas id="graficoReferencia" height="220"></canvas>
</div>

</div>
<h2>Observación</h2>

<p>
El informe resume el pesaje registrado en la aplicación,
incluyendo promedio, uniformidad, CV y extremos de peso.
</p>

<p class="note">
La referencia central de Hy-Line W-80 utilizada por la aplicación
corresponde al punto medio del rango de referencia configurado
para la edad del lote.
</p>

<p class="note">
Generado desde Pesos Pollitas Pro.
</p>

`;
}

let ps=[...db.pesajes].sort(
(a,b)=>
b.fecha.localeCompare(a.fecha)||
b.semana-a.semana
);

$('sel').innerHTML=ps.map(p=>{

let l=db.lotes.find(x=>x.id===p.loteId);

return `
<option value="${p.id}">
${esc(l?.nombre||'-')} · semana ${p.semana} · ${esc(p.fecha)}
</option>
`;

}).join('');

render();
function dibujarGraficos(){

let seleccionado=db.pesajes.find(p=>p.id===$('sel').value);

if(!seleccionado)return;

let pesajesLote=db.pesajes
.filter(x=>x.loteId===seleccionado.loteId)
.sort((a,b)=>a.fecha.localeCompare(b.fecha));

let canvas=$('graficoEvolucion');
let canvas2=$('graficoReferencia');

if(!canvas||!canvas2)return;

let ctx=canvas.getContext('2d');

let w=canvas.width=canvas.clientWidth*2;
let h=canvas.height=220*2;

ctx.clearRect(0,0,w,h);

if(pesajesLote.length===0)return;

let valores=pesajesLote.map(x=>x.stats.m);

let objetivos=pesajesLote
.map(x=>Number(x.objetivo))
.filter(x=>Number.isFinite(x));

let max=Math.max(...valores,...objetivos);
let min=Math.min(...valores,...objetivos);

if(max===min){
max+=10;
min-=10;
}

let margen=40;
let ancho=w-margen*2;
let alto=h-margen*2;

function punto(valor,i){

let x=margen+
(i/Math.max(pesajesLote.length-1,1))*ancho;

let y=h-margen-
((valor-min)/(max-min))*alto;

return {x,y};

}

ctx.font='24px Arial';
ctx.textAlign='left';

/* PESO REAL */

ctx.beginPath();

pesajesLote.forEach((p,i)=>{

let q=punto(p.stats.m,i);

if(i===0)
ctx.moveTo(q.x,q.y);
else
ctx.lineTo(q.x,q.y);

});

ctx.stroke();

pesajesLote.forEach((p,i)=>{

let q=punto(p.stats.m,i);

ctx.beginPath();
ctx.arc(q.x,q.y,6,0,Math.PI*2);
ctx.fill();

ctx.fillText(
p.stats.m.toFixed(0)+' g',
q.x-20,
q.y-12
);

});

/* OBJETIVO HY-LINE */

let referencias=pesajesLote
.map((p,i)=>({
p:p,
i:i,
objetivo:Number(p.objetivo)
}))
.filter(x=>Number.isFinite(x.objetivo));

if(referencias.length>0){

ctx.save();

ctx.setLineDash([18,12]);

ctx.beginPath();

referencias.forEach((r,index)=>{

let q=punto(r.objetivo,r.i);

if(index===0)
ctx.moveTo(q.x,q.y);
else
ctx.lineTo(q.x,q.y);

});

ctx.stroke();

ctx.restore();

ctx.setLineDash([]);

referencias.forEach(r=>{

let q=punto(r.objetivo,r.i);

ctx.fillText(
r.objetivo.toFixed(0)+' g',
q.x-20,
q.y+28
);

});

}

/* SEGUNDO GRÁFICO: PESO VS OBJETIVO */

let ctx2=canvas2.getContext('2d');

let w2=canvas2.width=canvas2.clientWidth*2;
let h2=canvas2.height=220*2;

ctx2.clearRect(0,0,w2,h2);

ctx2.font='24px Arial';
ctx2.textAlign='left';

let valoresComparacion=
pesajesLote.filter(p=>Number.isFinite(Number(p.objetivo)));

if(valoresComparacion.length>0){

let datos=[
...valoresComparacion.map(p=>p.stats.m),
...valoresComparacion.map(p=>Number(p.objetivo))
];

let max2=Math.max(...datos);
let min2=Math.min(...datos);

if(max2===min2){
max2+=10;
min2-=10;
}

let margen2=40;
let ancho2=w2-margen2*2;
let alto2=h2-margen2*2;

function punto2(valor,i){

let x=margen2+
(i/Math.max(valoresComparacion.length-1,1))*ancho2;

let y=h2-margen2-
((valor-min2)/(max2-min2))*alto2;

return {x,y};

}

/* PESO */

ctx2.beginPath();

valoresComparacion.forEach((p,i)=>{

let q=punto2(p.stats.m,i);

if(i===0)
ctx2.moveTo(q.x,q.y);
else
ctx2.lineTo(q.x,q.y);

});

ctx2.stroke();

valoresComparacion.forEach((p,i)=>{

let q=punto2(p.stats.m,i);

ctx2.beginPath();
ctx2.arc(q.x,q.y,6,0,Math.PI*2);
ctx2.fill();

});

/* OBJETIVO */

ctx2.save();

ctx2.setLineDash([18,12]);

ctx2.beginPath();

valoresComparacion.forEach((p,i)=>{

let q=punto2(Number(p.objetivo),i);

if(i===0)
ctx2.moveTo(q.x,q.y);
else
ctx2.lineTo(q.x,q.y);

});

ctx2.stroke();

ctx2.restore();

ctx2.setLineDash([]);

}

}
dibujarGraficos();
</script>

</body>
</html>
