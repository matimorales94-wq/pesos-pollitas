<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Informe de pesaje · Pesos Pollitas Pro</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
background:#f4f7f3;
color:#1f2933
}

.wrap{
max-width:900px;
margin:auto;
padding:18px 14px 40px
}

.toolbar{
display:flex;
gap:8px;
margin-bottom:14px
}

button{
border:0;
border-radius:11px;
padding:12px 15px;
font-weight:800;
font-size:15px;
background:#245c3a;
color:#fff
}

button.secondary{
background:#e5ece6;
color:#245c3a
}

select{
width:100%;
padding:12px;
border:1px solid #d5ddd6;
border-radius:11px;
font-size:16px;
background:#fff;
margin-bottom:14px
}

.report{
background:#fff;
border:1px solid #dfe7df;
border-radius:16px;
padding:24px;
box-shadow:0 2px 8px #00000008
}

.head{
display:flex;
align-items:center;
gap:16px;
border-bottom:2px solid #245c3a;
padding-bottom:14px;
margin-bottom:14px
}

.head img{
height:55px;
border-radius:8px
}

.head h1{
margin:0;
font-size:25px
}

.head p{
margin:3px 0 0;
color:#667085
}

.info{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:7px;
margin:10px 0 14px
}

.info div{
padding:8px;
border-bottom:1px solid #e5e7eb
}

.info b{
display:block;
font-size:11px;
color:#667085;
margin-bottom:2px
}

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
margin:10px 0
}

.metric{
background:#f7faf7;
border-radius:10px;
padding:11px
}

.metric b{
font-size:19px;
display:block
}

.metric span{
font-size:11px;
color:#6b7280
}

h2{
font-size:16px;
margin:14px 0 7px
}

.status{
padding:10px;
border-radius:10px;
background:#e7f2e9;
font-weight:700;
font-size:13px
}

p{
margin:6px 0;
font-size:12px
}

.note{
color:#667085;
font-size:9px
}

.error{
padding:18px;
text-align:center;
color:#a33232
}

@media(max-width:650px){
.info,.grid{
grid-template-columns:1fr
}
}

@media print{

@page{
size:A4 portrait;
margin:8mm
}

body{
background:#fff;
font-size:10px
}

.wrap{
padding:0;
max-width:none
}

.toolbar,.selector{
display:none
}

.report{
border:0;
box-shadow:none;
padding:0;
border-radius:0
}

.head{
gap:10px;
padding-bottom:7px;
margin-bottom:7px
}

.head img{
height:40px
}

.head h1{
font-size:20px
}

.head p{
font-size:10px
}

.info{
grid-template-columns:repeat(3,1fr);
gap:4px;
margin:6px 0 8px
}

.info div{
padding:5px
}

.info b{
font-size:8px;
margin-bottom:1px
}

.grid{
grid-template-columns:repeat(3,1fr);
gap:5px;
margin:6px 0
}

.metric{
padding:7px
}

.metric b{
font-size:14px
}

.metric span{
font-size:8px
}

h2{
font-size:12px;
margin:8px 0 4px
}

.status{
padding:7px;
font-size:9px
}

p{
font-size:9px;
margin:4px 0
}

.note{
font-size:7px
}

button{
display:none
}
}
</style>
</head>

<body>

<div class="wrap">

<div class="toolbar">
<button onclick="window.print()">📄 Generar / guardar PDF</button>
<button class="secondary" onclick="location.href='index.html'">← Volver a la app</button>
</div>

<div class="selector">
<label><b>Elegí el pesaje a informar</b></label>
<select id="sel" onchange="render()"></select>
</div>

<div id="report" class="report"></div>

</div>

<script>

const KEY='pesos_pollitas_pro_v2';

let db=JSON.parse(
localStorage.getItem(KEY)||'{"lotes":[],"pesajes":[]}'
);

const $=id=>document.getElementById(id);

function esc(s){
return String(s??'').replace(
/[&<>"']/g,
c=>({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#39;'
}[c])
);
}

function fechaLocal(s){
if(!s)return null;
let [y,m,d]=s.split('-').map(Number);
return new Date(y,m-1,d);
}

function edad(lote,fecha){

let b=fechaLocal(lote?.nacimiento);
let f=fechaLocal(fecha);

if(!b||!f)return '-';

let d=Math.floor((f-b)/86400000);

if(d<0)return '-';

return `${Math.floor(d/7)} semanas + ${d%7} días`;
}

function render(){

let id=$('sel').value;
let p=db.pesajes.find(x=>x.id===id);

if(!p){
$('report').innerHTML=
'<div class="error">No hay pesajes guardados para informar.</div>';
return;
}

let l=db.lotes.find(x=>x.id===p.loteId)||{};

let d=p.objetivo
?p.stats.m-p.objetivo
:null;

let estado=
d===null
?'Sin objetivo'
:d>=0
?`Por encima de la referencia (+${d.toFixed(0)} g)`
:`Por debajo de la referencia (${d.toFixed(0)} g)`;

$('report').innerHTML=`

<div class="head">

<img src="Gottig-Emprendimiento-Logo.png">

<div>
<h1>Informe de pesaje</h1>
<p>Pesos Pollitas Pro · Gottig Emprendimiento</p>
</div>

</div>

<div class="info">

<div>
<b>Lote</b>
${esc(l.nombre||'-')}
</div>

<div>
<b>Genética</b>
${esc(l.genetica||'-')}
</div>

<div>
<b>Galpón</b>
${esc(l.galpon||'-')}
</div>

<div>
<b>Fecha</b>
${esc(p.fecha||'-')}
</div>

<div>
<b>Edad</b>
${edad(l,p.fecha)}
</div>

<div>
<b>Aves pesadas</b>
${p.pesos.length}
</div>

</div>

<h2>Resultados</h2>

<div class="grid">

<div class="metric">
<b>${p.stats.m.toFixed(0)} g</b>
<span>Peso promedio</span>
</div>

<div class="metric">
<b>${p.stats.u.toFixed(1)}%</b>
<span>Uniformidad ±10%</span>
</div>

<div class="metric">
<b>${p.stats.cv.toFixed(1)}%</b>
<span>Coeficiente de variación</span>
</div>

<div class="metric">
<b>${p.stats.min} g</b>
<span>Peso mínimo</span>
</div>

<div class="metric">
<b>${p.stats.max} g</b>
<span>Peso máximo</span>
</div>

<div class="metric">
<b>${p.objetivo?p.objetivo+' g':'-'}</b>
<span>Referencia cargada</span>
</div>

</div>

<div class="status">
${estado}
</div>

<h2>Observación</h2>

<p>
El informe resume el pesaje registrado en la aplicación,
incluyendo promedio, uniformidad, CV y extremos de peso.
</p>

<p class="note">
La referencia central de Hy-Line W-80 utilizada por la aplicación
corresponde al punto medio del rango de referencia configurado
para la edad del lote.
</p>

<p class="note">
Generado desde Pesos Pollitas Pro.
</p>

`;
}

let ps=[...db.pesajes].sort(
(a,b)=>
b.fecha.localeCompare(a.fecha)||
b.semana-a.semana
);

$('sel').innerHTML=ps.map(p=>{

let l=db.lotes.find(x=>x.id===p.loteId);

return `
<option value="${p.id}">
${esc(l?.nombre||'-')} · semana ${p.semana} · ${esc(p.fecha)}
</option>
`;

}).join('');

render();

</script>

</body>
</html>
